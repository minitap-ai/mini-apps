name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      minisweeper: ${{ steps.filter.outputs.minisweeper }}
      luigi: ${{ steps.filter.outputs.luigi }}
      croissant: ${{ steps.filter.outputs.croissant }}
      pantry: ${{ steps.filter.outputs.pantry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            minisweeper:
              - 'minisweeper/**'
              - '.github/workflows/ci.yml'
            luigi:
              - 'luigi/**'
              - '.github/workflows/ci.yml'
            croissant:
              - 'croissant/**'
              - '.github/workflows/ci.yml'
            pantry:
              - 'pantry/**'
              - '.github/workflows/ci.yml'

  minisweeper:
    needs: changes
    if: needs.changes.outputs.minisweeper == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minisweeper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build web

  luigi:
    needs: changes
    if: needs.changes.outputs.luigi == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luigi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  croissant:
    needs: changes
    if: needs.changes.outputs.croissant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: croissant
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: croissant/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export -p web

  pantry:
    needs: changes
    if: needs.changes.outputs.pantry == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pantry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pantry/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo export -p web
